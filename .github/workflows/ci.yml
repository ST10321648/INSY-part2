name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Mongo URLs used by connectDb() in NODE_ENV=test
      MONGO_URI: mongodb://localhost:27017/payments_portal
      MONGO_URI_TEST: mongodb://localhost:27017/payments_portal_test
      # Reasonable defaults for lockout config
      LOCKOUT_MAX_ATTEMPTS: 5
      LOCKOUT_WINDOW_MINUTES: 15
      # Dummy JWT secrets (real ones only in prod)
      JWT_ACCESS_SECRET: dummy-access-secret-for-ci
      JWT_REFRESH_SECRET: dummy-refresh-secret-for-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        run: npm ci

      - name: Run backend tests (Mongo + Node test)
        run: npm test

      - name: Backend dependency audit (high+)
        run: npm audit --audit-level=high || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Run frontend tests (Jest in CI mode)
        env:
          CI: true
        run: npm test -- --watch=false

      - name: Build frontend
        run: npm run build

      - name: Frontend dependency audit (high+)
        run: npm audit --audit-level=high || true

